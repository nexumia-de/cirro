# Licence of every file, for "reuse lint" (https://reuse.software).
# Licence texts are in LICENSES/; bundled libraries are listed in
# docs/dependencies.md.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 suitably"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# AppStream metadata is CC0 so stores and distributions can reuse it.
[[annotations]]
path = "data/*.metainfo.xml"
precedence = "override"
SPDX-FileCopyrightText = "2026 suitably"
SPDX-License-Identifier = "CC0-1.0"

# Radar composite from DWD open data (CC BY 4.0), unchanged.
[[annotations]]
path = ["tests/data/composite_rv_*", "tests/data/demo/**"]
precedence = "override"
SPDX-FileCopyrightText = "Deutscher Wetterdienst"
SPDX-License-Identifier = "CC-BY-4.0"

# Nominatim answers recorded for tests: OpenStreetMap data (ODbL 1.0).
[[annotations]]
path = "tests/data/nominatim/**"
precedence = "override"
SPDX-FileCopyrightText = "OpenStreetMap contributors"
SPDX-License-Identifier = "ODbL-1.0"
