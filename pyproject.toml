# Only tool configuration; the app is built and installed with meson.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "toolkit/lib"]

# Lint, format and type check (docs/dev-environment.md, code quality);
# pinned in requirements-dev.txt, run by the "lint" job in tests.yml.
[tool.ruff]
line-length = 100
# The GNOME runtime has a newer Python; CI's tests run on Ubuntu's 3.12.
target-version = "py312"
# The toolkit submodule is linted in its own repository.
extend-exclude = ["toolkit"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cirro"]

[tool.mypy]
python_version = "3.12"
files = ["cirro"]
# gi, numpy and h5py come from the system in CI, not from the lint venv.
ignore_missing_imports = true
# Check the bodies of functions without annotations too; the known
# errors are in build-aux/mypy-baseline.txt (build-aux/mypy_ratchet.py).
check_untyped_defs = true

[tool.ruff.lint.per-file-ignores]
# Recorded server answers inline, kept verbatim.
"tests/test_layers_wms.py" = ["E501"]
