name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install dependencies
        run: |
          apt=(sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120)
          "${apt[@]}" update -q
          "${apt[@]}" install -y -q --no-install-recommends \
            python3-pytest python3-h5py python3-numpy python3-pyproj \
            python3-gi gir1.2-gtk-4.0 \
            appstream desktop-file-utils
      - name: Validate metadata
        run: |
          desktop-file-validate data/*.desktop
          appstreamcli validate --no-net data/*.metainfo.xml
          grep -Eiq '^X-Purism-FormFactor=.*mobile;' data/*.desktop
      - name: Run tests
        run: /usr/bin/python3 -m pytest -v

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install the pinned tools
        run: |
          python3 -m venv /tmp/lint
          /tmp/lint/bin/pip install --no-cache-dir -r requirements-dev.txt
      - name: Ruff
        run: |
          /tmp/lint/bin/ruff check --output-format github .
          /tmp/lint/bin/ruff format --check .
      - name: Type check (ratchet)
        run: PATH=/tmp/lint/bin:$PATH python3 build-aux/mypy_ratchet.py
