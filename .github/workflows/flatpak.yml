name: Flatpak
on:
  push:
    branches: [main]
    # v<version> publishes the stable app (docs/release-channels.md).
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  flatpak:
    permissions:
      contents: write
    uses: nexumia-de/phosh-toolkit/.github/workflows/flatpak.yml@2b2d1ad327cb73d462c09bf1cceadb8e4e1220aa # v0.7.1
    with:
      manifest: de.nexumia.Cirro.yml
      # Tags publish Cirro, every push to main publishes Cirro (Nightly);
      # nexumia-de/phosh-apps serves both (docs/release-channels.md).
      release: true
      nightly: true
      publish-repo: nexumia-de/phosh-apps
    secrets:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
