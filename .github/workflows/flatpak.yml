name: Flatpak
on:
  push:
    branches: [main]
    # v<version> publishes the stable app (docs/release-channels.md).
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  flatpak:
    permissions:
      contents: write
    # Temporary until nexumia-de/phosh-toolkit#10 is merged; back to @main then.
    uses: nexumia-de/phosh-toolkit/.github/workflows/flatpak.yml@claude/zen-rubin-y1tlsu
    with:
      manifest: de.nexumia.Cirro.yml
      # Tags publish Cirro, every push to main publishes Cirro (Nightly);
      # suitably/phosh-apps serves both (docs/release-channels.md).
      release: true
      nightly: true
      publish-repo: suitably/phosh-apps
    secrets:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
