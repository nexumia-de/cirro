id: de.nexumia.Cirro
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: cirro
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Radar data (opendata.dwd.de) and map tiles (tile.openstreetmap.org).
  - --share=network
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gir-1.0
  - '*.a'
  - '*.la'
# Every module pins exact versions and checksums. x-checker-data lets
# flatpak-external-data-checker propose updates (weekly, see
# .github/workflows/update-check.yml); every module installs its licence
# texts into /app/share/licenses/<app id>/<module>/, which CI checks.
# Inventory with licences: docs/dependencies.md.
modules:
  # Runtime check (docs/data-sources.md): org.gnome.Platform//51 ships
  # libsoup 3 and json-glib, but not libshumate, protobuf-c, numpy or h5py.
  - name: protobuf-c
    buildsystem: autotools
    config-opts:
      - --disable-protoc
    post-install:
      - install -Dm644 LICENSE -t ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/protobuf-c
    sources:
      - type: archive
        url: https://github.com/protobuf-c/protobuf-c/releases/download/v1.5.2/protobuf-c-1.5.2.tar.gz
        sha256: e2c86271873a79c92b58fef7ebf8de1aa0df4738347a8bd5d4e65a80a16d0d24
        x-checker-data:
          type: json
          url: https://api.github.com/repos/protobuf-c/protobuf-c/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "protobuf-c-" + $version + ".tar.gz") | .browser_download_url

  - name: libshumate
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dgtk_doc=false
      - -Dvapi=false
      - -Ddemos=false
      - -Dsysprof=disabled
    post-install:
      # meson builds in _flatpak_build/, the licence is in the source root.
      - install -Dm644 ../COPYING -t ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/libshumate
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libshumate/1.7/libshumate-1.7.0.tar.xz
        sha256: 3896cc4b6a7bf83141c27df23ce48cdd68467603bc6b764960307cdcbbef80e5
        x-checker-data:
          type: gnome
          name: libshumate
          stable-only: true

  # numpy and h5py are built from their source archives, as Flathub
  # requires for every bundled dependency (phosh-toolkit docs/flathub.md).
  # Their Python build tools not in the SDK (which has Cython and
  # packaging) are pure-Python wheels, removed after the build; only
  # their licence texts stay.
  - name: python3-build-tools
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} --no-deps
        meson-python pyproject-metadata pkgconfig
      - |
        for d in ${FLATPAK_DEST}/lib/python3*/site-packages/*.dist-info; do
          dest=${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/python3-build-tools/$(basename "$d" | sed 's/-[0-9].*//')
          install -d "$dest"
          if [ -d "$d/licenses" ]; then
            cp -r "$d/licenses/." "$dest"
          else
            find "$d" -maxdepth 1 -type f \( -iname 'licen[cs]e*' -o -iname 'copying*' \) -exec cp -t "$dest" {} +
          fi
        done
    cleanup:
      - /bin
      - /lib
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/96/62/0c1cf20fe158b0e623e78acbf5fb6de5f1410a408f65f727e4090497627b/meson_python-0.22.1-py3-none-any.whl
        sha256: 258fde948cf45aab5df23fcc9e17a9050ee73d4e1002fe6cf86519f61c414778
        x-checker-data:
          type: pypi
          name: meson-python
          packagetype: bdist_wheel
      - type: file
        url: https://files.pythonhosted.org/packages/b9/8e/d883718e872abc214ba053f60f7e6edc2abd5ffbd1544beb01a9c92ddd3c/pyproject_metadata-0.12.1-py3-none-any.whl
        sha256: f7162d580a96386a8eb096da06215f981f547d1490f03055ef99e323bc2da427
        x-checker-data:
          type: pypi
          name: pyproject-metadata
          packagetype: bdist_wheel
      - type: file
        url: https://files.pythonhosted.org/packages/75/6f/f7ec07fba48f07c555cc4099481df644fbbc12067879072c17ac229f6556/pkgconfig-1.6.0-py3-none-any.whl
        sha256: 98e71754855e9563838d952a160eb577edabb57782e49853edb5381927e6bea1
        x-checker-data:
          type: pypi
          name: pkgconfig
          packagetype: bdist_wheel

  # Without BLAS/LAPACK: Cirro only indexes and scales arrays.
  - name: python3-numpy
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} --no-deps
        -Csetup-args=-Dblas=none -Csetup-args=-Dlapack=none numpy
      - install -d ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}
      - cp -r ${FLATPAK_DEST}/lib/python3*/site-packages/numpy-*.dist-info/licenses ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/python3-numpy
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/95/b0/c7453d0b6e2073c3264468b106ee1563750cecc910965e67357e3698c83e/numpy-2.5.4.tar.gz
        sha256: 9a94cf751c9ad8ebaa835bcd3d40dacf8534ad086b88c38029b65123c7999d2a
        x-checker-data:
          type: pypi
          name: numpy

  # The HDF5 C library for h5py, with the zlib (gzip) filter DWD's files
  # use; no szip, tools, tests or examples.
  - name: hdf5
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_STATIC_LIBS=OFF
      - -DBUILD_TESTING=OFF
      - -DHDF5_BUILD_TOOLS=OFF
      - -DHDF5_BUILD_EXAMPLES=OFF
      - -DHDF5_ENABLE_ZLIB_SUPPORT=ON
      - -DHDF5_ENABLE_SZIP_SUPPORT=OFF
    post-install:
      - install -Dm644 ../LICENSE -t ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/hdf5
    cleanup:
      - /cmake
      - /lib/cmake
      - /share/doc
      - /bin
    sources:
      - type: archive
        url: https://github.com/HDFGroup/hdf5/releases/download/2.0.0/hdf5-2.0.0.tar.gz
        # The paths start with ./hdf5-2.0.0/.
        strip-components: 2
        sha256: f4c2edc5668fb846627182708dbe1e16c60c467e63177a75b0b9f12c19d7efed
        x-checker-data:
          type: json
          url: https://api.github.com/repos/HDFGroup/hdf5/releases/latest
          version-query: .tag_name | sub("^hdf5_"; "")
          url-query: .assets[] | select(.name == "hdf5-" + $version + ".tar.gz") | .browser_download_url

  - name: python3-h5py
    buildsystem: simple
    build-options:
      env:
        HDF5_DIR: /app
    build-commands:
      - pip3 install --no-index --no-build-isolation --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} --no-deps h5py
      - install -d ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}
      - cp -r ${FLATPAK_DEST}/lib/python3*/site-packages/h5py-*.dist-info/licenses ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/python3-h5py
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/db/33/acd0ce6863b6c0d7735007df01815403f5589a21ff8c2e1ee2587a38f548/h5py-3.16.0.tar.gz
        sha256: a0dbaad796840ccaa67a4c144a0d0c8080073c34c76d5a6941d6818678ef2738
        x-checker-data:
          type: pypi
          name: h5py

  - name: cirro
    buildsystem: meson
    sources:
      - type: dir
        path: .
        skip:
          - build-dir
          - repo
          - tests
